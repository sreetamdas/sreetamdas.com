# Iosevka build plan for the site's "das-version" coding font.
#
# PROVENANCE
#   Reverse-engineered, not authored upstream. The original build used a private
#   Iosevka build plan that was never committed; every value below was recovered
#   from the shipped subsets.
#
#   Recovery method: Iosevka's stock v28.0.4 defaults were found to match the
#   shipped outlines to <= 1 unit across all 125 upright / 96 italic codepoints,
#   which is what identifies "das-version" as stock v28.0.4 under a renamed
#   family. Each value below was then read back out of the rebuilt subsets
#   (fontTools) and confirmed to match, so this file records verified values
#   rather than guesses.
#
#   KNOWN GAP: nothing in `pnpm build` reads the font binaries, because doing so
#   needs a font parser the Node build does not have. So `pnpm build` verifies
#   references and hashes only. `pnpm fonts:build --check` is the guard that does
#   read them: it rebuilds from source and compares tables, outlines and advances.
#
# HOW TO REBUILD
#   `pnpm fonts:build` rebuilds every committed file from Iosevka source;
#   `pnpm fonts:build --check` rebuilds into the cache dir and diffs without
#   writing anything. Both go through scripts/build-iosevka-fonts.ts, which reads
#   this file: the family, version, commit, styles, ligation set, codepoint ranges
#   and width are all taken from here, so editing a value is what changes the
#   build. Font parsing lives in scripts/iosevka-fonts.py and runs through
#   `uv run --with fonttools --with brotli`; nothing is added to node_modules.
#
#   Iosevka's build tools are not npm dependencies (the `iosevka` and
#   `iosevka-build-tools` packages were unpublished in 2020), so the script
#   shallow-clones the pinned tag into ${XDG_CACHE_HOME:-~/.cache}/sreetamdas-iosevka
#   (override with --cache-dir or SREETAMDAS_IOSEVKA_CACHE) and runs its own
#   `npm install` and unhinted build there.
#
#   Every committed byte reproduces. All six files come out of this pipeline, and
#   `--check` requires them byte for byte; on a mismatch it also compares every
#   table, outline and advance so the failure says whether the glyphs changed or
#   only their encoding.
#
# FILE NAMING
#   public/fonts/iosevka/iosevka-das-version-<style>.<sha256[0:8]>.subset.woff2
#   The hash is the sha256 prefix of the final bytes, so a rebuild must rehash and
#   update all six references in global.css, __root.tsx and inject-early-hints.mjs.
#   `pnpm fonts:build` does that by calling scripts/update-font-hashes.ts;
#   `scripts/check-font-references.ts` fails the build if any of it is stale.

[family]
# name ID 1, shared by all four faces.
name = "Iosevka — Das' version"
upstream = "Iosevka"
version = "28.0.4"
# The commit tag v28.0.4 pointed at when this plan was written. The rebuild
# refuses to run against a different one, so a moved tag cannot change the fonts.
commit = "75e8e0529c3ddb795f41c7279a21bc7526eda7cc"
# das-version is stock Iosevka with the family renamed; no glyph or metric edits.
rename_only = true

[styles]
# Regular + Bold, upright + 9-degree italic. `angle` maps to post.italicAngle.
regular = { weight = 400, width = "Normal", angle = 0 }
bold = { weight = 700, width = "Normal", angle = 0 }
italic = { weight = 400, width = "Normal", angle = -9 }
bold-italic = { weight = 700, width = "Normal", angle = -9 }
# OS/2 usWidthClass 5 (Medium == Normal for a monospaced face).

[ligations]
# Iosevka ships the default contextual set under `calt`; nothing else. Inheriting
# the stock default is what enables -> => !== === <= >= || |> ... <!-- in code.
inherits = "default-calt"
# Only regular is preloaded; the other three load on first use.
preload = ["regular"]

[metrics]
# upem 1000 throughout. Used by the @capsizecss "Iosevka Fallback" overrides in
# global.css, which exist so inline code does not reflow when Iosevka swaps in.
units_per_em = 1000
cap_height = 735
x_height = 520
ascender = 965
descender = -215
line_gap = 70
# OS/2 sTypo* with fsSelection USE_TYPO_METRICS; usWin* matches the typo ascent.
typo_ascender = 965
typo_descender = -285
typo_line_gap = 0
win_ascent = 965
win_descent = 285
underline_position = -50
underline_thickness = 50
use_typo_metrics = true
# Every advance is 500/1000 em: this is what makes the fallback size-adjust work.
advance_width = 500

[subsetting]
# Uprights keep Latin-1 punctuation; italics stay ASCII-only. Ligature glyphs
# are retained even though they sit outside these ranges (subset from the hinted
# TTF, after ligation).
upright.codepoints = ["U+000D", "U+0020-U+007E", "U+00A0-U+00BB", "U+00D7"]
italic.codepoints = ["U+000D", "U+0020-U+007E"]
# Ligature coverage confirmed with hb-shape against the shipped files:
# -> => === !== <= >= || ... |> <!-- all resolve to ligature glyphs; www does not.
ligatures_retained = true

[postprocess]
# Applied to the subsetted woff2 with fontTools. `hint = false` is why these files
# are ~76% smaller than the hinted build that PR #300 first shipped.
#
#   1. strip hinting: drop cvt / fpgm / prep / gasp and every glyph program, then
#      recompute maxp (fontTools leaves maxSizeOfInstructions stale otherwise).
#      Hinting only affects rasterisation at small sizes on Windows and low-DPI
#      displays; outlines, advances and GSUB are untouched — verified by
#      per-table digests against the hinted subsets.
#   2. clear the version record's processor suffix. Iosevka writes
#      "Version 28.0.4; ttfautohint (v1.8.4)"; with hinting stripped that claim
#      is false, so it is reduced to "Version 28.0.4".
#   3. save as woff2 through fontTools, whose compressor is substantially tighter
#      than the one that produced the original subsets (~62% of their bytes were
#      compression slack, not glyph data).
#   4. hash the result and rename (scripts/update-font-hashes.ts, which the build
#      script calls and which also rewrites the references in global.css,
#      __root.tsx and inject-early-hints.mjs).
hint = false
clear_version_processor = true
recompress = "fontTools/woff2"
# Iosevka stamps head.created/modified from SOURCE_DATE_EPOCH, or its own build
# date when that is unset, so two builds of identical sources differ in those
# timestamps (and the checksum that covers them). Pinning the epoch — the value
# every committed file carries, 2026-09-20 15:49:42Z — is what makes a rebuild
# byte-identical instead of merely content-identical.
head_epoch = 3872764182

[share_card_ttf]
# src/lib/domains/foobar/fonts/iosevka-das-version-{regular,bold}.ttf feed the
# certificate share card: satori (workers-og) reads TTF/OTF/WOFF but not woff2.
# They come from the same source build as the woff2 (Iosevka tag v28.0.4 with this
# plan, target `ttf-unhinted`), cut to the upright codepoints above. That is
# exactly what `pnpm fonts:build` does:
#
#   pyftsubset DasVersion-<Style>.ttf \
#     --unicodes="U+000D,U+0020-007E,U+00A0-00BB,U+00D7" \
#     --layout-features="calt" --no-hinting --recalc-bounds
#
# Iosevka's own `excludeChars` cannot express a cut this large in v28.0.4 (the
# GSUB writer fails with "Missing Item in Lookups"), hence pyftsubset. All 323
# outlines, advances, cmap and GSUB match the shipped woff2 subsets exactly, so
# the card renders the same glyphs as the site.
files = ["iosevka-das-version-regular.ttf", "iosevka-das-version-bold.ttf"]

