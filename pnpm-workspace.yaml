runtimeOnFail: ignore
pmOnFail: ignore
allowBuilds:
  "@sentry/cli": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite: "catalog:"
  brace-expansion: ^5.0.12
  fflate: ^0.7.5
  nanoid: ^3.3.18
  sharp: ^0.35.5
  source-map-js: ^1.2.2
  undici: ^7.29.1
  # Only SQL Server uses these, and the site speaks SQLite through D1. Dropping the
  # auto-installed peers also drops tedious and its advisory-laden sprintf-js.
  "drizzle-orm>mssql": "-"
  "drizzle-orm>@types/mssql": "-"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
autoInstallPeers: true
enablePrePostScripts: true
minimumReleaseAge: 0
