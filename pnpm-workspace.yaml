runtimeOnFail: ignore
pmOnFail: ignore
allowBuilds:
  "@sentry/cli": true
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite: "catalog:"
  brace-expansion: ^5.0.12
  fflate: ^0.7.5
  nanoid: ^3.3.18
